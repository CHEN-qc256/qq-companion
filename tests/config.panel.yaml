# qq-companion 配置
#
# 这个文件由「管理面板」生成 —— 每个参数上面的注释就是面板里的说明，两边同源。
# 手工改这里也能生效，但下次在面板上保存会被面板的内容覆盖。
# 生成时间：2026-10-14 23:00:31
#
# 带 ★ 的项直接决定花多少钱，改之前先看注释。

# ──── 模型与花销 ───────────────────────────────────────────────────────
# 用哪个模型、开不开思考模式。这一组是花钱的大头，改之前先看说明。

llm:
  # 调用 DeepSeek 接口用的密钥，在 platform.deepseek.com 申请。
  # 留空则读环境变量 DEEPSEEK_API_KEY。这个值会明文写进 config.yaml，别外传。
  api_key: ""
  # DeepSeek 的 API 根地址。除非用代理，否则不要改。
  # 改完需重启：httpx 客户端的 base_url 在初始化时固定。
  base_url: "https://api.deepseek.com"
  # 用哪个模型。flash 便宜 6 倍，陪聊完全够用。
  # deepseek-flash 支持看图；deepseek-v4-pro 不支持。价格差在计价表那一组里。
  model: "deepseek-flash"
  # 开启后模型会先「想」再回答，思维链按输出 token 计费（4~8 元/百万）。
  # ★ 头号省钱开关。陪聊场景每轮白烧几百 token，开一天就是十几块。关掉对闲聊质量几乎没影响。
  thinking: false
  # 单条回复最多生成多少 token。陪聊 200 足够。
  # ★ 输出按 4~8 元/百万计费，调大直接多花钱。1 个汉字约 0.6~0.7 token。
  max_tokens: 200
  # 越大越放飞。只在思考模式关闭时有效。
  # 陪聊建议 1.1~1.4：太低像客服，太高会胡言乱语。
  temperature: 1.3
  # 单次请求等多久算失败。
  # 单位秒。网络差可以调大；调太大会让回复卡很久。
  timeout: 60
  # 打开后完全不联网，用假的固定回复跑通流程，不花一分钱。
  # 自测用。真实使用时必须是 false，否则它永远只会回同一句话。
  mock: true

# ──── 接入 NapCat ───────────────────────────────────────────────────
# 和 QQ 协议端怎么连接。这一组的端口改完必须重启，因为 socket 在启动时就绑好了。

onebot:
  # reverse = 本程序监听端口，NapCat 连过来；forward = 本程序主动连 NapCat。
  # 推荐 reverse：NapCat 重启不会把程序带断。改完必须重启。
  mode: "reverse"
  # reverse 模式下绑定哪个网卡。本机用 0.0.0.0 或 127.0.0.1 都行。
  # 改完必须重启：socket 在启动时绑定。
  host: "127.0.0.1"
  # reverse 模式下监听的端口。要和 NapCat 网络配置里填的端口一致。
  # 改完必须重启。如果提示端口被占用，多半是上一个 main.py 没退干净。
  port: 3021
  # reverse 模式下的 URL 路径。要和 NapCat 里填的一致。
  # 改完必须重启。
  path: "/onebot/v11/ws"
  # forward 模式下主动去连的地址。
  # 只有 mode = forward 时才用到。改完必须重启。
  url: "ws://127.0.0.1:3000"
  # 和 NapCat 网络配置里填的 token 保持一致。
  # 不填就两边都留空。改完必须重启。
  access_token: ""

# ──── 花钱闸门 ────────────────────────────────────────────────────────
# 日预算、月预算、省电模式和硬停线。超过预算会自动降级，不会突然烧光。

budget:
  # 一天最多花多少钱，超了自动转省电模式（上下文变短、回复变短）。
  # 单位元。省电模式不会不回消息，只是回得更省。
  daily_yuan: 6
  # 一个月最多花多少钱，同样触发省电模式。
  # 单位元。
  monthly_yuan: 45
  # 两条回复之间至少隔这么久，防止连续刷屏被风控盯上。
  # 单位秒。设 0 就是不限。
  min_interval_seconds: 1
  # 进入省电模式后，历史预算从 context.history_tokens 降到这个值。
  # 单位 token。调小更省，但记性会变差。
  saver_history_tokens: 600
  # 进入省电模式后，单条回复长度上限。
  # 单位 token。
  saver_max_tokens: 80
  # 花到日预算的几倍就彻底停止回复，必须人工改配置才能恢复。
  # 最后一道闸门。到了这一步它完全不回消息，日志里会写明原因。
  hard_stop_multiplier: 3

# ──── 上下文与压缩 ──────────────────────────────────────────────────────
# 历史攒到多长就压成摘要。这是省 token 的核心，压缩比调太大会丢细节。

context:
  # 累积的历史超过这个长度就压成摘要。★ 是压缩，不是丢弃。
  # 单位 token。调大记性更好但每轮都更贵；调小省钱。1500 是陪聊的甜点值。
  history_tokens: 1500
  # 每次压缩吃掉最老的多大比例。
  # 取值范围 0.1~0.9。太大会一次丢太多细节，太小会压缩得太频繁（每次都花一次摘要的钱）。
  compress_ratio: 0.6
  # 生成摘要和画像时最多输出多少 token。
  # 只有触发压缩时才花这笔钱。
  summary_tokens: 300
  # 生成用户画像（称呼/工作/喜好/雷区）时最多输出多少 token。
  # 和摘要同一次调用产出，不额外花钱。
  profile_tokens: 200

# ──── 说话节奏 ────────────────────────────────────────────────────────
# 像不像人的关键：读多久、打多久、分几条发、什么时候晚点回。最值得慢慢调的一组。

humanize:
  # 收到消息后先「愣」多久才开始打字，模拟人看到消息需要时间。
  # 单位秒。这一段完全不输出内容，是纯粹的拟人成本（不影响 token）。
  read_delay_min: 0.4
  # 读延迟的上限，实际值在这个区间里随机取。
  # 单位秒。
  read_delay_max: 1.8
  # 每个字打多久，用来算「正在输入」的时长。
  # 单位秒/字。越小回得越快。
  typing_per_char_min: 0.09
  # 每个字打多久的上限。
  # 单位秒/字。
  typing_per_char_max: 0.22
  # 不管多短的一句话，至少「打」这么久。
  # 单位秒。防止秒回显得太假。
  typing_min: 1.2
  # 打字时长的上限，超过就按上限算。
  # 单位秒。长回复不会真的等几分钟。
  typing_max: 12
  # 拆成多条时，两条之间隔多久。
  # 单位秒。真人连发两条不会瞬间发出。
  segment_gap_min: 0.6
  # 分条间隔的上限。
  # 单位秒。
  segment_gap_max: 2.2
  # 回复超过这个字数就拆成两条。
  # 单位字。调小会拆更多条，显得话多且碎。
  segment_max_len: 60
  # 拆条的上限，超出的部分合并回最后一条。
  # 防止一次甩出七八条刷屏（那是最容易被当成机器人的行为）。
  segment_max_count: 3
  # 他连发三条时，等这么久把三条合并成一次回复。
  # ★ 既省 token 又像人（真人不会你每发一句就秒回一句）。设 0 就是每条都单独回。
  debounce_seconds: 1.2
  # 有多大比例的消息会故意拖一会儿再回，模拟人在忙别的事。
  # 取值 0~1。0.08 = 8%。设 0 就永远秒回（会显得太闲）。
  late_reply_chance: 0.08
  # 触发晚回时，至少拖这么久。
  # 单位秒。默认 60 秒。
  late_reply_min: 60
  # 触发晚回时，最多拖这么久。
  # 单位秒。默认 1500 秒 = 25 分钟。
  late_reply_max: 1500
  # 命中这些正则的消息直接用固定话术回复，完全不调模型，0 token。
  # 这是最便宜的一项优化。但别加太多，否则会显得很机械 —— 真人不会每句都回得一模一样。
  trivial_replies:
    - ["^(在|在吗|在不在|在么)[？?！!。.]*$", "在"]
    - ["^(嗯|恩|哦|噢|好吧|行吧)[。.！!]*$", "嗯"]
    - ["^(晚安|睡了|睡觉了|困了)[。.！!]*$", "晚安"]
    - ["^(哈哈|哈哈哈|hhhh)+[。.！!]*$", "笑死"]

# ──── 作息与情绪 ───────────────────────────────────────────────────────
# 真人不 24 小时待命。睡着时不会丢消息，会挂成任务等醒了再回。

life:
  # 关掉的话它就 24 小时在线，任何时候都秒回 —— 这本身就很不像人。
  # 关掉后下面所有作息设置失效，晚上的消息也会立刻回。
  enabled: false
  # 这段时间内完全不回复。消息不会丢，会挂成任务等醒了再回。
  # 支持跨零点（比如 [23, 8] 表示晚上 11 点到早上 8 点）。
  sleeping: [1, 8]
  # 这些时间段里回得短、有点敷衍（因为在上班）。
  # 可以加多段。只有 weekday_only_work 为 true 时才只在工作日生效。
  working: [[9, 12], [14, 18]]
  # 关掉的话周末也会按上班时段的语气说话。
  weekday_only_work: true
  # 每种状态下它会带什么情绪。这段文字会进当轮动态块，影响说话语气。
  # 不会破坏缓存（动态块本来就每轮都变）。可以随便写得具体一点。
  moods:
    sleeping: "刚睡醒，还在迷糊"
    working: "在上班，偷偷摸鱼回消息"
    winding_down: "晚上在家瘫着，懒得动"
    free: "闲着，有空聊天"
  proactive:
    # 他不说话的时候，偶尔主动找他一次。
    # 关掉的话它永远不会主动开口。
    enabled: false
    # 至少安静这么久才可能主动开口。
    # 单位小时。调小会显得黏人。
    min_idle_hours: 6
    # ★ 每天最多主动找几次。
    # 调高会非常像推销号。真人没事不会一天问你八遍「在干嘛」。
    max_per_day: 2
    # 只在一天中的这段时间内主动开口。
    # 支持跨零点。凌晨主动发消息会吓到人。
    active_hours: [10, 23]
    # 每隔多久看一次要不要开口。
    # 单位分钟。程序内部强制不低于 1 分钟。
    check_interval_minutes: 15
    # 主动搭话时从长期记忆里挑几条旧事当话题。
    # 没有由头它就不会开口（干巴巴的「在吗」比不发更减分）。设 0 就永远不会主动说话。
    topics_from_memory: 3

# ──── 长期记忆 ────────────────────────────────────────────────────────
# 全部在本地跑：分词 + IDF + 时间衰减，0 token、0 延迟。

memory:
  # 关掉后它只会记得当前对话窗口内的内容，跨天的旧事全忘。
  # 检索本身 0 token，只有「抽取」会花一点钱。
  enabled: true
  # 每聊这么多轮，把对话里值得记的事提取一次。
  # 这是记忆功能里唯一花 token 的地方。调大更省，但记性更新得慢。
  extract_every_turns: 4
  # 第一次抽取至少要有这么多轮对话。
  # 刚聊两句就抽，抽不出有意义的长期信息。所以新装的时候聊几轮还没记忆是正常的。
  extract_min_turns: 2
  # 单次抽取最多产出几条长期记忆。
  # 调大会让抽取的输出变长（花更多输出 token）。
  extract_max_facts: 4
  # 抽取那一次调用最多输出多少 token。
  # 每条事实约 30~40 token，4 条的话 220 够用。
  extract_max_tokens: 220
  # 每轮对话最多把几条旧记忆塞进上下文。
  # 每条都会增加当轮输入 token。3 条是个平衡点。
  top_k: 3
  # 注入时每条记忆最多保留多少字。
  # 单位字。太长会挤占历史预算。
  max_chars: 30
  # ★ 他这句话的信息量，至少要有这么多比例被某条记忆接住，才注入。
  # 只卡「像不像」，不卡新旧 —— 半年前但完全对得上的事仍然会被想起，只是排序靠后。调高 = 更少但更准。
  min_sim: 0.45
  # 记忆的新鲜度过多少天减半。
  # 只影响排序（先想起哪几条），不影响要不要想起。
  half_life_days: 30
  # 新的记忆和已有的多像就算同一条，走合并而不是新增。
  # 调低会合并得太狠（把不同的事并成一条），调高会堆一堆重复条目。
  dedup_threshold: 0.72

# ──── 人设 ──────────────────────────────────────────────────────────
# 它扮演谁、在群里叫什么名字。改人设文件会让缓存失效一次，之后重新累积。

persona:
  # 私聊时它扮演谁。这是最能影响体验的一个文件。
  # 相对路径按项目根目录解析。文件不存在会用一个极简的兜底人设。
  file: "persona/default.md"
  # 它在群里被叫到这个名字就会回复。
  # setup.py 里的人设名改的就是这一项。
  name: "遥遥"
  # 群聊时用另一套人设。群里的分寸跟私聊不一样。
  # 文件不存在会自动退回上面那份私聊人设，不会崩。
  group_file: "persona/group.md"
  # 群聊时被叫到哪个名字才回。留空就用上面的「名字」。
  # 比如私聊叫遥遥、群里叫遥神，就填这里。
  group_name: ""

# ──── 谁能跟它说话 ──────────────────────────────────────────────────────
# 私聊白名单、群白名单、要不要自动认主人。

whitelist:
  # 只理这些 QQ 号。留空 = 靠下面的自动认主人来决定。
  # 手写就是 [123456, 789012] 这种格式。填了之后，不在这里面的人发消息会被无视。
  private: []
  # ★ 只在这些群里活动。留空 = 任何群都理。
  # 留空的风险：别人把你小号拉进陌生群，它就会在里面说话。第一次收到某个群的消息时，日志会打出群号，抄过来填这里。
  groups: []
  # ★ 群里没 @ 到它时，按这个概率主动插话。
  # 0 = 完全不插话（只在被叫到时回）。在活跃群里随机插话是会被踢和举报的，调之前想好。
  group_reply_rate: 0
  # 前 N 个私聊它的人自动进白名单（写进本地数据库，不改配置文件）。
  # 默认 1：你拿主号发一条「在吗」就绑定好了，不用手抄 QQ 号。设 0 = 关掉，此时变成谁都能聊。
  auto_accept_first: 1

# ──── 群聊 ──────────────────────────────────────────────────────────
# 群里默认只在被 @ 或叫名字时说话，而且有三层限流，防止被踢。

group:
  # 关掉 = 完全不理群消息（私聊不受影响）。
  enabled: true
  # ★ true = 只理 @ 它和叫它名字的；false = 按上面的随机插话概率。
  # 强烈建议保持 true。改成 false 之前先想清楚会不会被踢。
  address_required: true
  # 同一个人在群里连着 @ 它，两次回复至少隔这么久。
  # 单位秒。防止一个人连着问就把它变成复读机。
  per_user_cooldown_seconds: 20
  # ★ 不管谁说话，整个群两次回复至少隔这么久。
  # 单位秒。这是防刷屏的第一道闸门。
  reply_cooldown_seconds: 8
  # 硬上限：这个群每小时最多回几条，到量就闭嘴，下一小时恢复。
  # 单位条。活跃群里这是保命的数字。
  max_replies_per_hour: 30
  # 群聊单独的历史预算，一般比私聊更紧。
  # 单位 token。群里人多、话题散，记得越多越贵而且越容易串味。0 = 跟私聊共用。
  history_tokens: 900
  # 群里一次最多发几条消息。
  # 默认 1。连发三条在几个人的小群里非常扎眼。
  max_segments: 1

# ──── 数据与日志 ───────────────────────────────────────────────────────
# 数据库和日志文件的位置。这一组改完必须重启。

database:
  # 聊天记录、长期记忆、花费流水都存在这里。只存本地，不外传。
  # 改完必须重启：sqlite 连接在启动时建立。改路径等于换一套记忆。
  path: "data/panel_e2e.db"

# ──── 数据与日志 ───────────────────────────────────────────────────────
# 数据库和日志文件的位置。这一组改完必须重启。

logging:
  # 写进日志文件的详细程度。
  # DEBUG 会多记录很多细节（排查问题用），日常用 INFO。改完必须重启：日志 handler 在启动时建立。
  level: "INFO"
  # 运行日志写到哪个文件。面板的实时日志读的就是这个文件。
  # 改完必须重启。
  file: "data/panel_e2e.log"

# ──── 计价表 ─────────────────────────────────────────────────────────
# 元 / 百万 token。高峰 = 工作日 9-12 点、14-18 点，其余走空闲价（正好一半）。

pricing:
  # 各模型在高峰/空闲时段的价格，用来算每轮花了多少钱。
  # 单位：元 / 百万 token。★ 未命中缓存比命中贵 50 倍（flash），所以省钱的本质是提高缓存命中率。价格若官方调整，改这里即可。
  currency_per_million:
    deepseek-flash:
      cache_hit:
        peak: 0.04
        offpeak: 0.02
      cache_miss:
        peak: 2
        offpeak: 1
      output:
        peak: 8
        offpeak: 4
    deepseek-v4-pro:
      cache_hit:
        peak: 0.3
        offpeak: 0.15
      cache_miss:
        peak: 9
        offpeak: 4.5
      output:
        peak: 27
        offpeak: 13.5
  # 哪几天算高峰（0 = 周一，6 = 周日）。
  # 高峰时段价格是空闲的两倍。默认工作日是高峰。
  peak_weekdays: [0, 1, 2, 3, 4]
  # 一天里哪几段算高峰。
  # 默认北京时间 9-12 点、14-18 点。其余时间（含周末和法定节假日）走空闲价，正好一半。
  peak_ranges: [[9, 12], [14, 18]]
  # 这些日期按空闲价算（因为不上班，API 也半价）。
  # 按年作废。用 python tools/holidays.py --write 拉当年的日历自动填，别手写。留空会让节假日被当成高峰。
  holidays: []
